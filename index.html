<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUMA.D</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif}.top{background:#25D366;padding:14px;font-weight:900;display:flex;justify-content:space-between}.chat{padding:10px;padding-bottom:85px}.b{max-width:75%;padding:10px;border-radius:18px;margin:8px 0}.me{background:#25D366;color:#000;margin-left:auto}.other{background:#222}.bar{position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;display:flex;gap:8px}.bar input{flex:1;background:#222;border:none;padding:12px;border-radius:25px;color:#fff}.bar button{background:#25D366;border:none;width:45px;height:45px;border-radius:50%}</style></head><body><div class="top"><span>JUMA.D 🔥</span><span>Online</span></div><div class="chat" id="c"><div class="b other">Mkuu Shaggy karibu! Andika hapa chini 👇</div></div><div class="bar"><input id="t" placeholder="Andika..."><button onclick="document.getElementById('f').click()">📎</button><button onclick="s()">➤</button></div><input type="file" id="f" hidden accept="image/*,video/*" onchange="sf(event)"><script>function s(){let i=document.getElementById('t');if(!i.value.trim())return;let c=document.getElementById('c');let d=document.createElement('div');d.className='b me';d.innerHTML=i.value+`<div style='font-size:11px;color:#25D366' onclick="window.open('https://wa.me/?text='+encodeURIComponent(this.parentElement.innerText))">↗ Share</div>`;c.appendChild(d);i.value=''}function sf(e){let u=URL.createObjectURL(e.target.files[0]);let c=document.getElementById('c');let d=document.createElement('div');d.className='b me';d.innerHTML=`<img src="${u}" style="max-width:200px;border-radius:10px">`;c.appendChild(d)}document.getElementById('t').addEventListener('keypress',e=>{if(e.key==='Enter')s()})</script></body></html>
