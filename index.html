<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUMA.D REAL</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:sans-serif}#top{background:#25D366;padding:14px;font-weight:bold;display:flex;justify-content:space-between}#bar{display:flex;gap:12px;padding:12px;background:#1f1f1f;overflow-x:auto}.s{min-width:65px;text-align:center;cursor:pointer}.c{width:62px;height:62px;border-radius:50%;border:3px solid #25D366;object-fit:cover;background:#333;display:flex;align-items:center;justify-content:center;font-size:28px}.card{background:#222;margin:10px;border-radius:12px;padding:12px}#btn{background:#25D366;color:#000;border:none;padding:12px;border-radius:25px;font-weight:bold;width:100%;margin-top:8px;cursor:pointer}#view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}.prog{height:3px;background:#555;display:flex}.fill{height:100%;background:#fff;width:0%}.v-top{padding:12px;display:flex;justify-content:space-between;background:rgba(0,0,0,.6)}.v-mid{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}.v-mid img,.v-mid video{max-width:100%;max-height:70vh;border-radius:12px}</style></head><body>
<div id="top"><span>JUMA.D 🔥 REAL APP</span><span style="font-size:11px">● LIVE</span></div>
<div id="bar"><div class="s" onclick="document.getElementById('file').click()"><div class="c" style="border-color:#fff">+</div><div style="font-size:11px">Add</div></div><div id="statusList" style="display:flex;gap:12px"></div></div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<div style="padding:10px"><div class="card"><h3 style="margin:0;color:#25D366">Hii ni ya Kweli Mkuu! 🔥</h3><p style="font-size:13px;color:#aaa">Bonyeza + Add uchague picha/video halisi kutoka simu!</p><input id="msg" placeholder="Caption..." style="width:100%;padding:10px;border-radius:8px;border:none;background:#333;color:#fff;margin-top:8px"><button id="btn" onclick="postText()">Chapisha Maandishi</button><button id="btn" style="background:#fff" onclick="window.open('https://wa.me/255756000000?text=Mkuu%20nimeiona%20App!','_blank')">💬 WhatsApp Yangu</button></div><div id="feed"></div></div>
<div id="view"><div class="prog"><div id="fill" class="fill"></div></div><div class="v-top"><span id="vName">Status</span><span onclick="closeS()" style="cursor:pointer">✕</span></div><div class="v-mid" onclick="closeS()"><div id="vContent"></div><p id="vCap"></p></div></div>
<script>
let statuses=JSON.parse(localStorage.getItem('juma_real')||'[{"name":"JUMA.D","emoji":"👑","cap":"Mfalme wa App! Hii ni ya kweli sasa!","type":"text"},{"name":"Shaggy","emoji":"🔥","cap":"Moto! Tuko LIVE!","type":"text"}]');
function render(){let b=document.getElementById('statusList'),f=document.getElementById('feed');b.innerHTML='';f.innerHTML='';statuses.forEach((s,i)=>{let thumb=s.type=='image'?`<img src="${s.data}" class="c">`:s.type=='video'?`<video src="${s.data}" class="c"></video>`:`<div class="c">${s.emoji}</div>`;b.innerHTML+=`<div class="s" onclick="openS(${i})">${thumb}<div style="font-size:10px;margin-top:3px">${s.name}</div></div>`;let media=s.type=='image'?`<img src="${s.data}" style="width:100%;border-radius:10px;margin-top:8px">`:s.type=='video'?`<video src="${s.data}" style="width:100%;border-radius:10px" controls></video>`:`<div style="font-size:50px;text-align:center;padding:15px">${s.emoji}</div>`;f.innerHTML+=`<div class="card"><b>${s.name}</b><p>${s.cap}</p>${media}</div>`})}
let cur=0,timer;function openS(i){cur=i;let s=statuses[i];document.getElementById('vName').innerText=s.name;document.getElementById('vCap').innerText=s.cap;let vc=document.getElementById('vContent');if(s.type=='image')vc.innerHTML=`<img src="${s.data}">`;else if(s.type=='video')vc.innerHTML=`<video src="${s.data}" autoplay controls></video>`;else vc.innerHTML=`<div style="font-size:100px">${s.emoji}</div>`;document.getElementById('view').style.display='flex';let fill=document.getElementById('fill');fill.style.width='0%';let w=0;clearInterval(timer);timer=setInterval(()=>{w+=1;fill.style.width=w+'%';if(w>=100){clearInterval(timer);if(cur<statuses.length-1)openS(cur+1);else closeS()}},40)}
function closeS(){document.getElementById('view').style.display='none';clearInterval(timer)}
document.getElementById('file').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){let type=file.type.startsWith('video')?'video':'image';statuses.unshift({name:'JUMA.D',cap:document.getElementById('msg').value||'Status yangu mpya 🔥',data:ev.target.result,type:type});localStorage.setItem('juma_real',JSON.stringify(statuses));render();document.getElementById('msg').value=''};r.readAsDataURL(file)});
function postText(){let t=document.getElementById('msg').value;if(!t)return alert('Andika caption mkuu!');statuses.unshift({name:'JUMA.D',emoji:'🔥',cap:t,type:'text'});localStorage.setItem('juma_real',JSON.stringify(statuses));render();document.getElementById('msg').value=''}
render();
</script></body></html>
