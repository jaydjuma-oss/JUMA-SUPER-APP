<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 JUMAJAY SUPER V3</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075e54">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Roboto}
body{background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}
header{background:#202c33;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a3942}
.logo{font-weight:900;color:#25d366;font-size:18px;display:flex;gap:8px;align-items:center}
.tabs{display:flex;background:#202c33}
.tab{flex:1;padding:14px 0;text-align:center;font-weight:700;font-size:12px;color:#8696a0;border-bottom:3px solid transparent}
.tab.active{color:#25d366;border-color:#25d366}
.page{display:none;height:calc(100vh - 102px);overflow-y:auto}
.page.active{display:block}
.card{background:#202c33;margin:10px;border-radius:12px;padding:14px}
.input{background:#2a3942;border:none;border-radius:8px;padding:12px;width:100%;color:#fff;outline:none;margin:6px 0}
.btn{background:#25d366;color:#000;border:none;border-radius:24px;padding:12px;font-weight:800;width:100%}
.btn2{background:transparent;border:1.5px solid #25d366;color:#25d366;border-radius:24px;padding:12px;width:100%;margin-top:8px;font-weight:700}
.friend{padding:12px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #1f2c34}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#075e54,#25d366);display:flex;align-items:center;justify-content:center;font-weight:800}
.call{background:#25d366;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;margin-left:auto}
.ring{width:54px;height:54px;border-radius:50%;padding:3px;background:conic-gradient(#25d366,gold,#25d366)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #0b141a;background:#202c33}
.viewer{position:fixed;inset:0;background:#000;z-index:99;display:none;align-items:center;justify-content:center}
.vcard{background:#000;height:calc(100vh - 102px);position:relative;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #111}
.vcard iframe,.vcard video{width:100%;height:100%;object-fit:contain}
.chat{position:fixed;inset:0;background:#0b141a;z-index:60;display:none;flex-direction:column}
</style>
</head>
<body>
<header><div class="logo"><i class="fa-solid fa-crown" style="color:gold"></i> JUMAJAY SUPER</div><div style="display:flex;gap:14px;color:#aebac1"><i class="fa-solid fa-magnifying-glass"></i><i class="fa-solid fa-ellipsis-vertical"></i></div></header>
<div class="tabs">
<div class="tab active" onclick="openT('chats',this)">CHATS</div>
<div class="tab" onclick="openT('status',this)">STATUS</div>
<div class="tab" onclick="openT('videos',this)">VIDEOS</div>
<div class="tab" onclick="openT('mine',this)">MINE</div>
</div>

<div id="chats" class="page active">
<div class="card"><b>Karibu Juma! 👑</b><input id="fn" class="input" placeholder="Jina la rafiki..."><button class="btn" onclick="addF()">+ Ongeza Rafiki</button></div>
<div id="fList"></div>
</div>

<div id="status" class="page">
<div class="card"><h4><i class="fa-solid fa-circle-plus" style="color:#25d366"></i> Status Halisi</h4>
<input type="file" id="sf" accept="image/*,video/*" hidden onchange="upS(this)">
