<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUMA.D ORIGINAL</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#fff;font-family:sans-serif;padding-bottom:70px}#top{background:linear-gradient(90deg,#7c3aed,#ec4899);padding:14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}#logo{font-size:18px;letter-spacing:1px}#nav{position:fixed;bottom:0;left:0;right:0;background:#15151f;display:flex;justify-content:around;padding:10px 0;border-top:1px solid #222;z-index:10}.nav{flex:1;text-align:center;font-size:12px;cursor:pointer;opacity:.6}.nav.active{opacity:1;color:#a78bfa}.page{display:none;padding:12px}.page.active{display:block}.card{background:#1a1a27;border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid #222}.user{display:flex;gap:12px;align-items:center;padding:12px;background:#1a1a27;border-radius:12px;margin-bottom:8px;cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:22px}.chatbox{position:fixed;inset:0;background:#0a0a0f;z-index:20;display:none;flex-direction:column}.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px}.me{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#ec4899)}.other{align-self:flex-start;background:#222}.inputBar{display:flex;gap:8px;padding:10px;background:#15151f;border-top:1px solid #222}.inputBar input{flex:1;background:#222;border:none;padding:12px;border-radius:25px;color:#fff}#send{background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;width:45px;height:45px;border-radius:50%;font-size:18px;cursor:pointer}.storyBar{display:flex;gap:12px;overflow-x:auto;padding:10px 0}.story{min-width:65px;text-align:center}.story.avatar{margin:0 auto 5px;border:2px solid #ec4899}input,textarea{background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;width:100%}button{background:linear-gradient(90deg,#7c3aed,#ec4899);border:none;padding:12px;border-radius:25px;color:#fff;font-weight:bold;width:100%;cursor:pointer;margin-top:8px}</style></head><body>
<div id="top"><span id="logo">JUMA.D ✨ SUPER</span><span style="font-size:12px;background:rgba(0,0,0,.3);padding:4px 8px;border-radius:10px">● ORIGINAL APP</span></div>

<div id="p1" class="page active">
<div class="storyBar"><div class="story"><div class="avatar" style="border-color:#fff" onclick="alert('Add story - chagua picha!')">+</div><div style="font-size:10px">Add</div></div><div class="story"><div class="avatar">👑</div><div style="font-size:10px">JUMA.D</div></div><div class="story"><div class="avatar">🔥</div><div style="font-size:10px">Shaggy</div></div></div>
<div style="margin-top:12px"><h3 style="margin:5px 0">Chats 🔥</h3><div id="chatList"></div><div class="card"><h4 style="margin:0">Ongeza Rafiki Mpya</h4><input id="newName" placeholder="Jina la rafiki..."><button onclick="addFriend()">Ongeza kwenye Chat</button></div></div>
</div>

<div id="p2" class="page"><h3>Statuses ✨</h3><div id="statusFeed"></div><div class="card"><textarea id="statusText" placeholder="Andika status yako ya leo..."></textarea><button onclick="addStatus()">Chapisha Status</button></div></div>
<div id="p3" class="page"><h3>Profile Yako 👑</h3><div class="card" style="text-align:center"><div class="avatar" style="width:80px;height:80px;margin:0 auto;font-size:40px">👑</div><h2>JUMA.D</h2><p style="color:#888">Mmiliki wa Super App ya kwanza Tanzania 🔥</p><p style="font-size:12px;color:#666">App yako ya Original - Sio WhatsApp!</p><button onclick="window.open('https://wa.me/255XXXXXXXXX?text=Nimeona%20JUMA.D%20APP!','_blank')">Wasiliana Nami</button></div></div>

<div id="chatBox" class="chatbox"><div style="padding:12px;background:#15151f;display:flex;justify-content:space-between;align-items:center"><span><b id="chatName">JUMA.D</b> <small style="color:#0f0">● online</small></span><span onclick="closeChat()" style="font-size:22px;cursor:pointer">✕</span></div><div id="msgs" class="msgs"></div><div class="inputBar"><input id="msgInput" placeholder="Andika ujumbe..."><button id="send" onclick="sendMsg()">➤</button></div></div>

<div id="nav" class="navBar"><div class="nav active" onclick="tab(1)">💬<br>Chats</div><div class="nav" onclick="tab(2)">✨<br>Status</div><div class="nav" onclick="tab(3)">👑<br>Mimi</div></div>

<script>
let friends=JSON.parse(localStorage.getItem('juma_friends')||'["Shaggy","Maboy","JUMA.D"]');
let chats=JSON.parse(localStorage.getItem('juma_chats')||'{}');
let statuses=JSON.parse(localStorage.getItem('juma_stat')||'[{"name":"JUMA.D","text":"Karibu kwenye App yangu ya Original! Sio WhatsApp - ni JUMA.D SUPER! 🔥","time":"sasa"},{"name":"Shaggy","text":"App ya mkuu iko moto! 💯","time":"1h"}]');
let current='';
function tab(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav').forEach(v=>v.classList.remove('active'));document.getElementById('p'+n).classList.add('active');document.querySelectorAll('.nav')[n-1].classList.add('active');if(n==1)renderChats();if(n==2)renderStatus()}
function renderChats(){let l=document.getElementById('chatList');l.innerHTML='';friends.forEach(f=>{let last=(chats[f]&&chats[f].length)?chats[f][chats[f].length-1].text:'Gusa kuanza chat...';l.innerHTML+=`<div class="user" onclick="openChat('${f}')"><div class="avatar">${f[0]}</div><div style="flex:1"><b>${f}</b><div style="font-size:12px;color:#888">${last}</div></div><div style="font-size:10px;color:#666">now</div></div>`})}
function renderStatus(){let f=document.getElementById('statusFeed');f.innerHTML='';statuses.forEach(s=>{f.innerHTML+=`<div class="card"><b>${s.name}</b> <small style="color:#666">• ${s.time}</small><p>${s.text}</p></div>`})}
function addFriend(){let n=document.getElementById('newName').value;if(!n)return;friends.unshift(n);localStorage.setItem('juma_friends',JSON.stringify(friends));document.getElementById('newName').value='';renderChats()}
function addStatus(){let t=document.getElementById('statusText').value;if(!t)return;statuses.unshift({name:'JUMA.D',text:t,time:'sasa'});localStorage.setItem('juma_stat',JSON.stringify(statuses));document.getElementById('statusText').value='';renderStatus();tab(2)}
function openChat(name){current=name;document.getElementById('chatName').innerText=name;document.getElementById('chatBox').style.display='flex';renderMsgs()}
function closeChat(){document.getElementById('chatBox').style.display='none';current=''}
function renderMsgs(){let m=document.getElementById('msgs');m.innerHTML='';(chats[current]||[]).forEach(c=>{m.innerHTML+=`<div class="m ${c.me?'me':'other'}">${c.text}</div>`});m.scrollTop=m.scrollHeight}
function sendMsg(){let inp=document.getElementById('msgInput');let t=inp.value;if(!t||!current)return;if(!chats[current])chats[current]=[];chats[current].push({text:t,me:true});localStorage.setItem('juma_chats',JSON.stringify(chats));inp.value='';renderMsgs();renderChats();setTimeout(()=>{chats[current].push({text:'Sawa mkuu! Nimepokea: '+t+' 🔥',me:false});localStorage.setItem('juma_chats',JSON.stringify(chats));renderMsgs()},1000)}
renderChats();renderStatus();
</script></body></html>
