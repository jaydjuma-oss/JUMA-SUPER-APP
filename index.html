<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>JUMA.D SUPER REAL</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:sans-serif}#top{background:#25D366;padding:14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}#bar{display:flex;gap:12px;padding:12px;background:#1f1f1f;overflow-x:auto;border-bottom:1px solid #333}.s{min-width:65px;text-align:center;cursor:pointer}.c{width:62px;height:62px;border-radius:50%;border:3px solid #25D366;object-fit:cover;background:#333;display:flex;align-items:center;justify-content:center;font-size:28px}.card{background:#222;margin:10px;border-radius:12px;padding:12px}#btn{background:#25D366;color:#000;border:none;padding:12px 20px;border-radius:25px;font-weight:bold;width:100%;margin-top:10px}#view{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:100}.prog{height:3px;background:#555;display:flex}.fill{height:100%;background:#fff;width:0%}.v-top{padding:12px;display:flex;justify-content:space-between;background:rgba(0,0,0,.6)}.v-mid{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}.v-mid img,.v-mid video{max-width:100%;max-height:70vh;border-radius:12px}</style></head>
<body>
<div id="top"><span>JUMA.D 🔥 REAL APP</span><span style="font-size:12px">● LIVE</span></div>
<div id="bar">
<div class="s" onclick="document.getElementById('file').click()"><div class="c" style="border-color:#fff">+</div><div style="font-size:11px;margin-top:4px">Add Status</div></div>
<div id="statusList" style="display:flex;gap:12px"></div>
</div>
<input type="file" id="file" accept="image/*,video/*" hidden>
<div style="padding:12px">
<div class="card"><h3 style="margin:0;color:#25D366">Karibu Mkuu! Hii ni ya Kweli Sasa 🔥</h3><p style="font-size:14px;color:#aaa">Bonyeza + Add Status, chagua picha/video kutoka simu yako. Itaonekana kama WhatsApp ya kweli!</p>
<input id="msg" placeholder="Andika caption..." style="width:100%;padding:10px;border-radius:8px;border:none;background:#333;color:#fff;margin-top:8px">
<button id="btn" onclick="postText()">Chapisha Status ya Maandishi</button>
<button id="btn" style="background:#fff;margin-top:8px" onclick="window.open('https://wa.me/255XXXXXXXXX?text=Mkuu%20nimeona%20App%20yako!','_blank')">💬 Nicheki WhatsApp</button>
<p style="font-size:11px;color:#666;margin-top:10px">Badilisha 255XXXXXXXXX na namba yako ya WhatsApp kwenye code</p>
</div>
<div id="feed"></div>
</div>
<div id="view"><div class="prog"><div id="fill" class="fill"></div></div><div class="v-top"><span id="vName">Status</span><span onclick="closeS()" style="cursor:pointer">✕</span></div><div class="v-mid" onclick="closeS()"><div id="vContent"></div><p id="vCap" style="margin-top:15px;text-align:center"></p></div></div>
<script>
let statuses = JSON.parse(localStorage.getItem('juma_status')||'[{"name":"JUMA.D","emoji":"👑","cap":"Mfalme wa App! Karibu kwenye App ya kweli!","type":"text"},{"name":"Shaggy","emoji":"🔥","cap":"App ya kweli ipo LIVE mkuu!","type":"text"}]');
let cur=0, timer;
function render(){let b=document.getElementById('statusList');let f=document.getElementById('feed');b.innerHTML='';f.innerHTML='';statuses.forEach((s,i)=>{let d=s.data||'';let thumb=s.type=='image'?`<img src="${d}" class="c">`:s.type=='video'?`<video src="${d}" class="c"></video>`:`<div class="c">${s.emoji||'👑'}</div>`;b.innerHTML+=`<div class="s" onclick="openS(${i})">${thumb}<div style="font-size:10px;margin-top:4px">${s.name}</div></div>`;let media=s.type=='image'?`<img src="${d}" style="width:100%;border-radius:10px;margin-top:8px">`:s.type=='video'?`<video src="${d}" style="width:100%;border-radius:10px" controls></video>`:'<div style="font-size:50px;text-align:center;padding:20px">'+(s.emoji||'🔥')+'</div>';f.innerHTML+=`<div class="card"><b>${s.name}</b> <small style="color:#888">• sasa</small><p>${s.cap}</p>${media}</div>`})}
function openS(i){cur=i;let s=statuses[i];document.getElementById('vName').innerText=s.name;document.getElementById('vCap').innerText=s.cap;let vc=document.getElementById('vContent');if(s.type=='image')vc.innerHTML=`<img src="${s.data}">`;else if(s.type=='video')vc.innerHTML=`<video src="${s.data}" autoplay controls style="max-width:100%"></video>`;else vc.innerHTML=`<div style="font-size:100px">${s.emoji}</div>`;document.getElementById('view').style.display='flex';let fill=document.getElementById('fill');fill.style.width='0%';let w=0;clearInterval(timer);timer=setInterval(()=>{w+=1;fill.style.width=w+'%';if(w>=100){clearInterval(timer);if(cur<statuses.length-1)openS(cur+1);else closeS()}},50)}
function closeS(){document.getElementById('view').style.display='none';clearInterval(timer)}
document.getElementById('file').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){let type=file.type.startsWith('video')?'video':'image';statuses.unshift({name:'JUMA.D',cap:document.getElementById('msg').value||'Status yangu mpya 🔥',data:ev.target.result,type:type});localStorage.setItem('juma_status',JSON.stringify(statuses));render();document.getElementById('msg').value=''};reader.readAsDataURL(file)});
function postText(){let t=document.getElementById('msg').value;if(!t)return alert('Andika kitu mkuu!');statuses.unshift({name:'JUMA.D',emoji:'🔥',cap:t,type:'text'});localStorage.setItem('juma_status',JSON.stringify(statuses));render();document.getElementById('msg').value=''}
render();
</script>
</body></html>
